[project]
name = "archipelago-grid"
version = "0.1.0"
description = "Runs tasks x models x repeats through the environment, agent and grading runners"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.14.5",
]

[tool.setuptools]
packages = ["grid"]

[tool.setuptools.package-data]
grid = ["defaults/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
