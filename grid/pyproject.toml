[project]
name = "archipelago-grid"
version = "0.1.0"
description = "Runs tasks x models x repeats through the environment, agent and grading runners"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.14.5",
]

[tool.setuptools]
packages = ["grid"]

[tool.setuptools.package-data]
grid = ["defaults/*", "static/**/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
