<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Dashboard</title>
  <meta name="description" content="Benchmark grid dashboard: tasks x models x repeats, live progress, tool-call map and leaderboard.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%233987e5'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%23d95926'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%23199e70'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23c98500'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint (dark is the default).
    try { var t = localStorage.getItem('grid-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/setup" aria-label="Grid home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">Grid</span>
      <span class="brand-id" id="grid-id">loading…</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Screens">
      <a href="#/setup" data-route="setup">Setup</a>
      <a href="#/live" data-route="live">Mission Control</a>
      <a href="#/map" data-route="map">Live Map</a>
      <a href="#/leaderboard" data-route="leaderboard">Leaderboard</a>
      <a href="#/infra" data-route="infra">Infra</a>
    </nav>
    <div class="topbar-right">
      <span class="badge badge-mock" id="mock-badge" hidden title="Data comes from the fixtures in /mock and a scripted simulator">Mock data</span>
      <span class="live-ind" id="live-ind" data-state="idle"><span class="live-dot"></span><span class="live-label">Not started</span></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme"></button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
